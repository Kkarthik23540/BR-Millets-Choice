openapi: 3.1.0
info:
  title: BR Millet Choice API
  version: 1.0.0
  description: Same-origin session API. Mutations require the X-CSRF-Token header.
servers:
  - url: /
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: brmc.sid
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
    OrderRequest:
      type: object
      required: [addressId, paymentMethod]
      properties:
        addressId: { type: string, format: uuid }
        paymentMethod:
          type: string
          enum: [cash_on_handover, manual_transfer]
        customerNote: { type: string, maxLength: 500 }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        status:
          type: string
          enum: [awaiting_confirmation, confirmed, preparing, ready_for_dispatch, shipped, out_for_delivery, delivered, rejected, cancelled]
        paymentStatus:
          type: string
          enum: [unpaid, pending, paid, failed, refunded]
        totalPaise: { type: string, pattern: '^[0-9]+$' }
security:
  - sessionCookie: []
paths:
  /api/health:
    get:
      security: []
      summary: Database-backed health check
      responses:
        '200': { description: Service and database are ready }
        '500': { description: Database unavailable }
  /api/csrf:
    get:
      security: []
      summary: Start a session and return its CSRF token
      responses:
        '200': { description: CSRF token }
  /api/products:
    get:
      security: []
      summary: List active products
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 80 }
        - in: query
          name: category
          schema: { type: string, maxLength: 60 }
      responses:
        '200': { description: Active catalogue }
  /api/auth/register:
    post:
      security: [ { sessionCookie: [], csrfToken: [] } ]
      summary: Register a customer account
      responses:
        '201': { description: Account created; email verification may require SMTP configuration }
        '409': { description: Duplicate account }
  /api/auth/login:
    post:
      security: [ { sessionCookie: [], csrfToken: [] } ]
      summary: Sign in with email and password
      responses:
        '200': { description: Session created }
        '401': { description: Credentials incorrect }
  /api/orders:
    post:
      security: [ { sessionCookie: [], csrfToken: [] } ]
      summary: Create an order request using server-side prices and inventory
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
      responses:
        '201': { description: Order request recorded and awaiting confirmation }
        '403': { description: Email verification or payment-method configuration required }
        '409': { description: Inventory or order conflict }
  /api/orders/{id}:
    get:
      summary: Get the signed-in customer’s own order
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Own order and status history }
        '404': { description: Order not found or not owned by current user }
  /api/admin/orders/{id}/status:
    patch:
      security: [ { sessionCookie: [], csrfToken: [] } ]
      summary: Apply an allowed order status transition (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Status changed and customer notified }
        '403': { description: Admin role required }
        '409': { description: Transition not allowed }
